name: Garmin to Gaia Sync - Reusable

on:
  workflow_call:
    inputs:
      activity_types:
        description: Comma-separated exact Garmin activity type keys
        type: string
        required: true
    secrets:
      GARMIN_TOKENS:
        required: true
      GAIA_SESSION_ID:
        required: true
      GAIA_FOLDER_ID:
        required: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: garmin-gaia-sync
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync Garmin tracks to Gaia
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_ACTIVITY_TYPES: ${{ inputs.activity_types }}
          GAIA_SESSION_ID: ${{ secrets.GAIA_SESSION_ID }}
          GAIA_FOLDER_ID: ${{ secrets.GAIA_FOLDER_ID }}
        run: python scripts/garmin-gaia-sync.py
