name: Sheet Backup (Source → Backup Google Sheet)

on:
  schedule:
    # Run daily at 07:00 UTC (after the Garmin sync at 06:00)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sheet backup script
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SOURCE_SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          BACKUP_SPREADSHEET_ID: ${{ secrets.BACKUP_SPREADSHEET_ID }}
        run: python scripts/sheet-backup.py
