name: Garmin to Gaia Sync - Mountain Biking

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    uses: ./.github/workflows/garmin-gaia-sync-reusable.yml
    with:
      activity_types: mountain_biking
    secrets:
      GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
      GAIA_SESSION_ID: ${{ secrets.GAIA_SESSION_ID }}
      GAIA_FOLDER_ID: ${{ secrets.GAIA_MOUNTAIN_BIKING_FOLDER_ID }}
