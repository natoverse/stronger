name: Garmin Activity Sync

on:
  schedule:
    # Run every hour, on the hour, matching the Garmin wellness sync.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill full history since 2015-01-01 (one-time import) instead of the rolling recent-activity fetch'
        type: boolean
        default: false
      overwrite:
        description: 'Overwrite (upsert) existing entries for the fetched window instead of only appending new ones'
        type: boolean
        default: true
permissions:
  contents: read

concurrency:
  group: firebase-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test Firestore mappings
        run: |
          python3 scripts/test_firestore_sync.py
          python3 scripts/test_garmin_sync.py

      - name: Run Garmin sync script
        id: sync
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_USER_ID: ${{ secrets.FIREBASE_USER_ID }}
        # Scheduled runs always overwrite the rolling window so recent entries
        # are refreshed (fixes partial mid-day entries and edited activities).
        run: python3 scripts/garmin-sync.py ${{ inputs.backfill && '--backfill' || '' }} ${{ (github.event_name == 'schedule' || inputs.overwrite) && '--overwrite' || '' }}

      # Reads step outputs written by the sync script (not shell-local state) so
      # the totals are printed even when the sync step fails.
      - name: Print Garmin sync summary
        if: always()
        env:
          FETCHED: ${{ steps.sync.outputs.fetched || 'unknown' }}
          VALID: ${{ steps.sync.outputs.valid || 'unknown' }}
          SKIPPED: ${{ steps.sync.outputs.skipped || 'unknown' }}
          ADDED: ${{ steps.sync.outputs.added || 'unknown' }}
          UPDATED: ${{ steps.sync.outputs.updated || 'unknown' }}
          STATUS: ${{ steps.sync.outputs.status || 'unknown' }}
        run: |
          echo "Garmin sync summary"
          echo "  fetched: $FETCHED"
          echo "  valid:   $VALID"
          echo "  skipped: $SKIPPED"
          echo "  added:   $ADDED"
          echo "  updated: $UPDATED"
          echo "  status:  $STATUS"
