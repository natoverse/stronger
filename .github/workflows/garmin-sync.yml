name: Garmin Sync (Garmin Connect → Firestore)

on:
  schedule:
    # Run every hour, on the hour, matching the Garmin wellness sync.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill full history since 2015-01-01 (one-time import) instead of the rolling recent-activity fetch'
        type: boolean
        default: false
      overwrite:
        description: 'Overwrite (upsert) existing rows for the fetched window instead of only appending new ones'
        type: boolean
        default: true
permissions:
  contents: read

concurrency:
  group: firebase-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test Firestore mappings
        run: |
          python3 scripts/test_firestore_sync.py
          python3 scripts/test_garmin_sync.py

      - name: Run Garmin sync script
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_USER_ID: ${{ secrets.FIREBASE_USER_ID }}
        # Scheduled runs always overwrite the rolling window so recent rows are
        # refreshed (fixes partial mid-day rows and picks up edited activities).
        run: python3 scripts/garmin-sync.py ${{ inputs.backfill && '--backfill' || '' }} ${{ (github.event_name == 'schedule' || inputs.overwrite) && '--overwrite' || '' }}
