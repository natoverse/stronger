name: Garmin Sync (Garmin Connect → Google Sheets)

on:
  schedule:
    # Run every hour, on the hour, matching the Garmin wellness sync.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill full history since 2021-01-01 (one-time import) instead of the rolling recent-activity fetch'
        type: boolean
        default: false
      overwrite:
        description: 'Overwrite (upsert) existing rows for the fetched window instead of only appending new ones'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Garmin sync script
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        # Scheduled runs always overwrite the rolling window so recent rows are
        # refreshed (fixes partial mid-day rows and picks up edited activities).
        run: python scripts/garmin-sync.py ${{ inputs.backfill && '--backfill' || '' }} ${{ (github.event_name == 'schedule' || inputs.overwrite) && '--overwrite' || '' }}
