name: Garmin to Gaia Sync

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Sync all eligible Garmin tracks since 2015-01-01'
        type: boolean
        default: false
      allow_duplicates:
        description: 'Upload tracks even when their Garmin activity ID already exists'
        type: boolean
        default: false
      probe_gaia_write_throttle:
        description: 'Probe Gaia write throttle timing with idempotent folder writes'
        type: boolean
        default: false
      probe_interval_minutes:
        description: 'Minutes to wait between Gaia write throttle probes'
        type: number
        default: 15
      probe_max_attempts:
        description: 'Maximum Gaia write throttle probe attempts'
        type: number
        default: 24

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync Garmin tracks to Gaia
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GAIA_SESSION_ID: ${{ secrets.GAIA_SESSION_ID }}
          GAIA_FOLDER_ID: ${{ secrets.GAIA_FOLDER_ID }}
        run: >-
          python scripts/garmin-gaia-sync.py
          ${{ inputs.backfill && '--backfill' || '' }}
          ${{ inputs.allow_duplicates && '--allow-duplicates' || '' }}
          ${{ inputs.probe_gaia_write_throttle && '--probe-gaia-write-throttle' || '' }}
          --probe-interval-minutes ${{ inputs.probe_interval_minutes || 15 }}
          --probe-max-attempts ${{ inputs.probe_max_attempts || 24 }}
