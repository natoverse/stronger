name: Benchmark Sheets vs Firestore reads

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of timed cold loads per selected tab (1-20)
        type: string
        default: '3'
      tabs:
        description: Comma-separated benchmark routes/tabs (blank runs shared plan defaults)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: firestore-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test benchmark helpers
        run: node --test scripts/test_firestore_benchmark.mjs

      - name: Compare read latency
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          FIREBASE_USER_ID: ${{ secrets.FIREBASE_USER_ID }}
          ITERATIONS: ${{ inputs.iterations }}
          TABS: ${{ inputs.tabs }}
        run: node scripts/firestore-benchmark.mjs
