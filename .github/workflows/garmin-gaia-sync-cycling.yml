name: Garmin to Gaia Sync - Cycling

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    uses: ./.github/workflows/garmin-gaia-sync-reusable.yml
    with:
      activity_types: cycling
    secrets:
      GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
      GAIA_SESSION_ID: ${{ secrets.GAIA_SESSION_ID }}
      GAIA_FOLDER_ID: ${{ secrets.GAIA_CYCLING_FOLDER_ID }}
