name: Garmin Wellness Sync

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC daily (one hour after garmin-sync)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill all data since 2021-01-01"
        required: false
        type: boolean
        default: false
      overwrite:
        description: "Overwrite (upsert) existing rows for the fetched window instead of only appending new ones"
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Garmin wellness sync
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        # Scheduled runs always overwrite the rolling window so recent days are
        # refreshed (fixes partial mid-day rows and picks up edited days).
        run: python scripts/garmin-wellness-sync.py ${{ inputs.backfill && '--backfill' || '' }} ${{ (github.event_name == 'schedule' || inputs.overwrite) && '--overwrite' || '' }}
