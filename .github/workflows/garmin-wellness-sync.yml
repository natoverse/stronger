name: Garmin Wellness Sync

on:
  schedule:
    # Every hour, on the hour. Kept deliberately simple (no time-zone / DST
    # gating): the sync only looks back 72 hours, so running around the clock is
    # cheap and guarantees near-continual updates.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill all data since 2021-01-01 (default is the last 72 hours)"
        required: false
        type: boolean
        default: false
      overwrite:
        description: "Overwrite (upsert) existing rows for the fetched window instead of only appending new ones"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: firebase-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test Firestore mappings
        run: |
          python3 scripts/test_firestore_sync.py
          python3 scripts/test_garmin_wellness_sync.py

      - name: Run Garmin wellness sync
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_USER_ID: ${{ secrets.FIREBASE_USER_ID }}
        # Scheduled runs always overwrite the last-72-hours window so recent days
        # are refreshed (fixes partial mid-day rows and picks up edited days).
        run: python3 scripts/garmin-wellness-sync.py ${{ inputs.backfill && '--backfill' || '' }} ${{ (github.event_name == 'schedule' || inputs.overwrite) && '--overwrite' || '' }}

      - name: Open an issue if the hourly sync fails
        # If the hourly cadence causes trouble (e.g. Garmin API rate limits),
        # surface a single deduplicated issue so the cron can be adjusted.
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Garmin wellness hourly sync is failing"
          gh label create garmin-sync --color "D93F0B" --description "Garmin sync automation problems" --force || true
          num=$(gh issue list --state open --search "\"${title}\" in:title" --json number,title --jq "[.[] | select(.title == \"${title}\")][0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Sync failed again at $(date -u +%FT%TZ). Run: ${RUN_URL}"
            echo "Issue #$num already open - added a comment."
            exit 0
          fi
          gh issue create \
            --title "${title}" \
            --label "garmin-sync" \
            --body "$(printf 'The Garmin wellness sync now runs hourly and a scheduled run just failed.\n\nThis is often a Garmin API rate limit from the hourly cadence. If so, consider reducing the cron frequency in `.github/workflows/garmin-wellness-sync.yml`.\n\nFailing run: %s' "${RUN_URL}")"
          echo "Opened a new tracking issue."
