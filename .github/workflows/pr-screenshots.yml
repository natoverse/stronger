name: PR Screenshots

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      screenshots-url: ${{ steps.screenshots.outputs.artifact-url }}
      report-url: ${{ steps.report.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:screenshots

      - id: screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshots
          path: artifacts/screenshots
          if-no-files-found: warn
          retention-days: 14

      - id: report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn
          retention-days: 14

      - if: always()
        run: |
          {
            echo "## PR screenshots"
            echo
            echo "- [Download screenshots](${{ steps.screenshots.outputs.artifact-url }})"
            echo "- [Open Playwright report](${{ steps.report.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"

  append-to-pr:
    if: always()
    needs: screenshots
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v8
        env:
          SCREENSHOTS_URL: ${{ needs.screenshots.outputs.screenshots-url }}
          REPORT_URL: ${{ needs.screenshots.outputs.report-url }}
        with:
          script: |
            const startMarker = '<!-- pr-screenshots:start -->'
            const endMarker = '<!-- pr-screenshots:end -->'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const screenshotsUrl = process.env.SCREENSHOTS_URL || runUrl
            const reportUrl = process.env.REPORT_URL || runUrl
            const section = [
              startMarker,
              '## PR screenshots',
              '',
              `- [Download screenshots](${screenshotsUrl})`,
              `- [Open Playwright report](${reportUrl})`,
              endMarker,
            ].join('\n')

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            })
            const body = pullRequest.body || ''
            const start = body.indexOf(startMarker)
            const end = body.indexOf(endMarker)
            const nextBody = start >= 0 && end >= start
              ? `${body.slice(0, start).trimEnd()}\n\n${section}${body.slice(end + endMarker.length)}`
              : `${body.trimEnd()}\n\n${section}`

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: nextBody.trim(),
            })
