name: Withings Sync (Withings → Firestore)

on:
  schedule:
    # Run daily at 06:30 UTC (offset from the Strava sync at 06:00)
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill full history since 2021-01-01 (one-time import) instead of the rolling 60-day window'
        type: boolean
        default: false
      overwrite:
        description: 'Overwrite (upsert) existing rows for the fetched window instead of only appending new ones'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: firebase-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Firestore mappings
        run: node --test scripts/test_firestore_sync.mjs scripts/test_withings_sync.mjs

      - name: Run Withings sync script
        env:
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          WITHINGS_REFRESH_TOKEN: ${{ secrets.WITHINGS_REFRESH_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_USER_ID: ${{ secrets.FIREBASE_USER_ID }}
        # Scheduled runs always overwrite the rolling window so recent rows are
        # refreshed (fixes partial mid-day rows and picks up edited weigh-ins).
        run: |
          for attempt in 1 2 3; do
            if node scripts/withings-sync.mjs ${{ inputs.backfill && '--backfill' || '' }} ${{ (github.event_name == 'schedule' || inputs.overwrite) && '--overwrite' || '' }}; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Withings sync attempt $attempt failed; retrying in 60 seconds."
            sleep 60
          done
