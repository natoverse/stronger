name: Withings Sync (Withings → Firestore)

on:
  schedule:
    # Run daily at 06:30 UTC (offset from the Strava sync at 06:00)
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill full history since 2021-01-01 (one-time import) instead of the rolling 60-day window'
        type: boolean
        default: false
      overwrite:
        description: 'Overwrite (upsert) existing rows for the fetched window instead of only appending new ones'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: firebase-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Withings sync script
        env:
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          WITHINGS_REFRESH_TOKEN: ${{ secrets.WITHINGS_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        # Scheduled runs always overwrite the rolling window so recent rows are
        # refreshed (fixes partial mid-day rows and picks up edited weigh-ins).
        run: node scripts/withings-sync.mjs ${{ inputs.backfill && '--backfill' || '' }} ${{ (github.event_name == 'schedule' || inputs.overwrite) && '--overwrite' || '' }}

      - name: Mirror Withings measurements to Firestore
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          FIREBASE_USER_ID: ${{ secrets.FIREBASE_USER_ID }}
          DRY_RUN: 'false'
          REPLACE_EXISTING: 'true'
          MIGRATION_COLLECTIONS: withingsMeasurements
        run: node scripts/firebase-migrate.mjs
