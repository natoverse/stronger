name: Garmin GPX Export

on:
  workflow_dispatch:
    inputs:
      activity_types:
        description: 'Comma-separated exact Garmin type keys (e.g. cycling,mountain_biking)'
        type: string
        required: true
        default: hiking,mountaineering

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Export Garmin GPX files
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_ACTIVITY_TYPES: ${{ inputs.activity_types }}
        run: python scripts/garmin-gpx-export.py

      - name: Upload Garmin GPX archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garmin-gpx-export
          path: garmin-gpx/
          if-no-files-found: error
          retention-days: 30
